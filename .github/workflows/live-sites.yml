name: Live sites

# Runs the built extension against real recipe pages. Deliberately kept out of
# the blocking CI path: these are third-party sites that rewrite their markup,
# rate-limit, and sometimes refuse datacentre IPs outright. A failure here is a
# signal to go look, not a reason to block a pull request.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  live:
    name: Render live recipe sites
    runs-on: macos-latest
    # Never fails the run; read the summary and the screenshots instead.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the extension
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run against live sites
        id: live
        run: npm run e2e:live 2>&1 | tee live-output.txt

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Live site results'
            echo
            echo '```'
            grep -E '^\s+(ok|FAIL)\s' live-output.txt || echo 'no per-site lines captured'
            echo '```'
            grep -E 'sites rendered a table' live-output.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-screenshots
          path: tests/e2e/screenshots/
          retention-days: 30
