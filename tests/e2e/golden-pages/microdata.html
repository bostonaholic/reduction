<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Garlic Bread</title>
<style>body{font-family:Georgia,serif;max-width:640px;margin:40px auto}</style></head>
<body itemscope itemtype="http://schema.org/Recipe">
<h1 itemprop="name">Garlic Bread</h1>
<p itemprop="recipeYield">1 loaf</p>
<ul>
  <li itemprop="recipeIngredient">1 baguette</li>
  <li itemprop="recipeIngredient">4 oz softened butter</li>
  <li itemprop="recipeIngredient">3 cloves garlic</li>
  <li itemprop="recipeIngredient">2 tbsp chopped parsley</li>
</ul>
<ol>
  <li itemprop="recipeInstructions">Preheat oven to 400 degrees F.</li>
  <li itemprop="recipeInstructions">Mince the garlic and mash it into the softened butter with the chopped parsley.</li>
  <li itemprop="recipeInstructions">Spread the mixture over the baguette.</li>
  <li itemprop="recipeInstructions">Bake for 12 minutes.</li>
</ol>
</body></html>
